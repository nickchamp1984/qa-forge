[project]
name = "qa-forge"
version = "0.2.0"
description = "AI-native engineering platform for QA engineers."
# Тимчасово вимкнено до створення README
# readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.28.1",
    "pendulum>=3.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
